<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tranche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400..900&family=UnifrakturMaguntia&family=Inter:ital,wght@0,300..800;1,400&display=swap">
<style>
/* Layout : la collection occupe tout l'écran (canvas). Interface réduite à un logo et un bouton rond. */
:root{
  --paper:#F4F4F1;
  --paper-2:#E9E9E4;
  --ink:#0E0E0E;
  --ink-soft:#6B6B66;
  --rub:#C8201A;       /* rouge de rubrique (les titres rouges des manuscrits) : la seule couleur */
  --glass:rgba(244,244,241,.86);
  --shadow:rgba(10,10,20,.2);
  --pages:#EFE9DA;
  --f-big:"Grenze Gotisch", "Old English Text MT", Georgia, serif;
  --f-goth:"UnifrakturMaguntia", "Grenze Gotisch", Georgia, serif;
  --f-text:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.2,.85,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E0E0E;--paper-2:#1A1A1A;--ink:#F2F2EE;--ink-soft:#8E8E88;--rub:#FF5A4A;--glass:rgba(20,20,20,.86);--shadow:rgba(0,0,0,.6);--pages:#D9D3C4;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E0E0E;--paper-2:#1A1A1A;--ink:#F2F2EE;--ink-soft:#8E8E88;--rub:#FF5A4A;--glass:rgba(20,20,20,.86);--shadow:rgba(0,0,0,.6);--pages:#D9D3C4;color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rub);outline-offset:3px}
.big{font-family:var(--f-big);font-weight:800;letter-spacing:-.01em;line-height:.92}

/* ---------- Landing ---------- */
#landing{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:transform 1.2s var(--ease)}
#landing.out{transform:translateY(-104%);pointer-events:none}
.l-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:13px;font-weight:500;font-stretch:90%}
.l-top span:last-child{color:var(--ink-soft)}
.l-mid{position:relative}
.l-title{margin:0;font-size:min(25vw,40vh);font-family:var(--f-goth);font-weight:400;letter-spacing:0;color:var(--ink);white-space:nowrap;margin-left:-.04em}
.l-title .k{color:var(--rub)}
.l-tw{position:relative;display:inline-block}
.l-scrib{position:absolute;left:47%;top:-10%;width:56%;height:120%;overflow:visible;pointer-events:none}
.l-scrib path{fill:none;stroke:var(--rub);stroke-width:4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s 1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.l-row{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-top:18px}
.l-tag{font-family:var(--f-text);font-style:italic;font-size:clamp(18px,2.2vw,26px);margin:0;max-width:26ch;line-height:1.3}
.l-cta{border:0;background:var(--rub);color:#fff;padding:18px 30px;border-radius:999px;font-weight:700;font-stretch:90%;font-size:16px;cursor:pointer;transition:transform .35s var(--ease)}
.l-cta:hover{transform:scale(1.06) rotate(-2deg)}
.l-shelf{display:flex;align-items:flex-end;gap:2px;height:150px;margin:0 -16px;overflow:hidden;border-bottom:2px solid var(--ink)}
.l-shelf span{flex:none;border-radius:2px 2px 0 0;animation:rise 1s var(--ease) both}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}

/* ---------- Scène ---------- */
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.grabbing{cursor:grabbing}
#stage.drawing{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#marks{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#marks path{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-width:2;opacity:.75}
#marks .k{stroke:var(--rub);opacity:1;stroke-width:3}
#ink{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:5}
#ink path{fill:none;stroke:var(--rub);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.clones{position:absolute;left:0;top:0;animation:fadein .8s .5s both}
@keyframes fadein{from{opacity:0}}

/* Livre : tranche + couverture repliée à 90°, révélée au survol */
.book{position:absolute;left:0;top:0;width:var(--w);height:var(--h);padding:0;border:0;background:none;cursor:pointer;transition:transform 1s var(--ease);will-change:transform}
.book:hover,.book:focus-visible{z-index:3}
.spine{position:absolute;inset:0;transform-style:preserve-3d;transform:perspective(900px);transition:transform .45s var(--ease),filter 1.4s ease;color:var(--t)}
.sf{position:absolute;inset:0;border-radius:2px 1px 1px 2px;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.16) 16%,rgba(255,255,255,.04) 36%,rgba(0,0,0,0) 60%,rgba(0,0,0,.22)),var(--c);
  box-shadow:0 1px 2px var(--shadow),inset 0 1px 0 rgba(255,255,255,.18)}
.cov{position:absolute;top:0;left:100%;width:calc(var(--h)*.66);height:100%;transform-origin:0 50%;transform:rotateY(90deg);backface-visibility:hidden;
  background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,0) 12%),var(--c);border-radius:0 2px 2px 0}
.pg{position:absolute;left:0;top:0;width:calc(var(--h)*.64);height:7px;transform-origin:0 0;transform:rotateX(-90deg);background:repeating-linear-gradient(0deg,var(--pages) 0 1px,#cfc7b4 1px 2px)}
.cov,.pg{visibility:hidden}
.book:hover .cov,.book:hover .pg,.book:focus-visible .cov{visibility:visible}
.book:hover .spine,.book:focus-visible .spine{transform:perspective(900px) translateY(-12px) translateZ(40px) rotateY(-34deg)}
.book.dusty .spine{filter:saturate(.1) contrast(.75) brightness(1.08)}
.book.gone{visibility:hidden}
.txt{position:absolute;inset:0;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;overflow:hidden}
.txt .ti{flex:1;min-height:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs);line-height:1}
.txt .au{font-stretch:75%;font-weight:600;font-size:9px;letter-spacing:.05em;text-transform:uppercase;opacity:.78;white-space:nowrap}
.txt .mk{width:8px;height:8px;flex:none;border-radius:50% 40% 55% 45%;background:currentColor;opacity:.6}
.v0 .ti{font-weight:800;text-transform:uppercase;letter-spacing:-.01em;font-size:calc(var(--fs)*.86)}
.v1 .ti{font-stretch:100%;font-weight:300;letter-spacing:.02em}
.v2 .ti{font-family:var(--f-big);font-weight:700;font-size:calc(var(--fs)*1.12)}
.v3 .ti{font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:calc(var(--fs)*.7)}
.v3 .sf::after{content:"";position:absolute;left:0;right:0;top:12%;height:4px;background:var(--t);opacity:.55}
.thin .au,.thin .mk{display:none}

.glabel{position:absolute;left:0;top:0;transform-origin:0 100%;pointer-events:none;animation:fadein .6s .4s both;color:var(--rub);white-space:nowrap}
.glabel span{display:block;font-size:var(--gs,56px)}
.glabel svg{position:absolute;left:-14%;top:-22%;width:128%;height:150%;overflow:visible}
.glabel path{fill:none;stroke:var(--rub);stroke-width:2.2;stroke-linecap:round}

/* ---------- Interface minimale ---------- */
.logo{position:fixed;z-index:10;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 10px 4px;border-radius:10px;margin-left:-10px;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-size:44px;line-height:1;color:var(--rub);pointer-events:none;font-family:var(--f-goth);font-weight:400;padding:4px 10px 6px}
.fab{position:fixed;z-index:12;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--rub);cursor:pointer;
  display:grid;place-items:center;transition:transform .45s var(--ease)}
.fab svg{width:34px;height:34px}
.fab[aria-expanded="true"]{transform:rotate(135deg)}
.menu{position:fixed;z-index:11;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 32px));
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:18px 20px;display:grid;gap:16px;
  border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:0 20px 60px -20px var(--shadow);
  transform-origin:100% 100%;transform:scale(.6) translateY(20px);opacity:0;pointer-events:none;transition:.4s var(--ease)}
.menu.on{transform:none;opacity:1;pointer-events:auto}
.menu h4{margin:0 0 4px;font-size:11px;font-weight:600;font-stretch:90%;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.opts{display:flex;flex-wrap:wrap;gap:2px 14px}
.opts button{border:0;background:none;padding:2px 0;cursor:pointer;font-size:32px;font-family:var(--f-big);font-weight:800;color:var(--ink);opacity:.32;transition:opacity .25s,color .25s}
.opts button:hover{opacity:.7}
.opts button[aria-pressed="true"]{opacity:1;color:var(--rub)}
.opts button:disabled{opacity:.12;cursor:default}
.menu .soon{display:flex;gap:8px}
.menu .soon button{border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);background:none;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;font-stretch:90%;cursor:pointer}
.menu p{margin:0;font-family:var(--f-text);font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
.menu p b{color:var(--rub);font-weight:400;font-style:italic}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;z-index:60;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;font-stretch:90%;transition:.4s var(--ease);pointer-events:none;max-width:calc(100vw - 110px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Fiche : livre 3D ---------- */
#sheet{position:fixed;inset:0;z-index:30;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .5s var(--ease);
  background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:64px}
#sheet.on{opacity:1;pointer-events:auto}
.sh{min-height:100%;display:flex;gap:clamp(36px,7vw,110px);align-items:center;max-width:1240px;margin:0 auto}
.b3{flex:none;perspective:2000px;cursor:pointer}
.bx{position:relative;width:var(--W);height:var(--H);transform-style:preserve-3d;will-change:transform}
.bf{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front,.back{top:0;bottom:0;left:-1px;right:0;border-radius:0 4px 4px 0;overflow:hidden}
.front .real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.front .real.on{opacity:1}
.front{transform:translateZ(calc(var(--D)/2));background:var(--c);color:var(--t);padding:9% 9% 8% 12%;display:flex;flex-direction:column;
  box-shadow:inset 10px 0 14px -10px rgba(0,0,0,.45)}
.front .ca{font-stretch:80%;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.front .ct{font-size:calc(var(--W)*.13);margin-top:8%;text-wrap:balance;overflow-wrap:anywhere}
.front.v1 .ct{font-family:var(--f-text);font-weight:300;letter-spacing:-.03em;line-height:.98;font-size:calc(var(--W)*.11)}
.front.v0 .ct,.front.v3 .ct{font-family:var(--f-text);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:.95;font-size:calc(var(--W)*.105)}
.front svg{flex:1;width:100%;min-height:0;margin-top:6%}
.front svg path{fill:none;stroke:var(--t);stroke-width:2.4;stroke-linecap:round}
.front .cy{font-size:12px;font-weight:600;opacity:.75}
.back{transform:rotateY(180deg) translateZ(calc(var(--D)/2));background:var(--c);color:var(--t);padding:12% 10% 8%;display:flex;flex-direction:column;gap:18px}
.back .bk{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.back p{font-size:clamp(13px,1.3vw,16px);line-height:1.55;margin:0}
.bars{margin-top:auto;align-self:flex-end;display:flex;gap:1.5px;height:40px;background:#fff;padding:5px 7px}
.bars span{background:#111;width:var(--bw)}
.side{top:0;height:100%;width:calc(var(--D) + 2px);left:calc((var(--W) - var(--D))/2 - 1px)}
.bsp{transform:rotateY(-90deg) translateZ(calc(var(--W)/2));background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.16) 16%,rgba(0,0,0,0) 60%,rgba(0,0,0,.22)),var(--c);color:var(--t)}
.bsp .txt{padding:6% 0}
.bsp .ti{font-size:calc(var(--D)*.42)}
.bpg{transform:rotateY(90deg) translateZ(calc(var(--W)/2 - 2px));background:repeating-linear-gradient(90deg,var(--pages) 0 1px,#d6cfbd 1px 2.5px)}
.btop{left:0;width:calc(100% - 2px);height:var(--D);top:calc((var(--H) - var(--D))/2);transform:rotateX(90deg) translateZ(calc(var(--H)/2));background:repeating-linear-gradient(0deg,var(--pages) 0 1px,#d6cfbd 1px 2.5px)}
.shadow3{position:absolute;left:6%;right:-4%;bottom:-6%;height:8%;background:radial-gradient(closest-side,var(--shadow),transparent);transform:translateZ(-80px)}

.info{flex:1;min-width:0;display:grid;gap:22px;opacity:0;transform:translateY(16px);transition:.7s var(--ease)}
#sheet.ready .info{opacity:1;transform:none;transition-delay:.35s}
.gk{justify-self:start;position:relative;color:var(--rub);font-size:22px;padding:4px 2px}
.gk svg{position:absolute;left:-18%;top:-30%;width:136%;height:160%;overflow:visible}
.gk path{fill:none;stroke:var(--rub);stroke-width:2;stroke-linecap:round}
.info h2{margin:0;font-size:clamp(54px,8.6vw,138px);text-wrap:balance;overflow-wrap:anywhere}
.info .by{font-family:var(--f-text);font-style:italic;font-size:clamp(20px,2vw,26px);margin:-4px 0 0}
.info dl{display:flex;flex-wrap:wrap;gap:8px 36px;margin:0}
.info dt{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.info dd{margin:2px 0 0;font-size:24px;font-weight:700;font-stretch:80%;font-variant-numeric:tabular-nums}
.info h3{margin:6px 0 -8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--rub)}
.info .sum{font-size:17px;line-height:1.7;margin:0;max-width:62ch;text-wrap:pretty}
.info .note{font-size:12px;color:var(--ink-soft);margin:0}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;background:var(--rub);color:#fff;border-radius:999px;padding:12px 20px;font-weight:700;font-stretch:90%;font-size:15px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
@media (max-width:820px){
  .sh{flex-direction:column;align-items:stretch;gap:40px}
  .b3{align-self:center}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- Landing -->
<section id="landing" aria-label="Accueil">
  <div class="l-top"><span>Bibliothèque personnelle</span><span id="lcount"></span></div>
  <div class="l-mid">
    <div class="l-tw"><h1 class="l-title">Tran<span class="k">che</span></h1>
    <svg class="l-scrib" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M30,8 C62,-4 98,8 99,48 C100,88 60,99 30,94 C4,90 -2,52 6,30 C12,14 26,8 44,6"/></svg></div>
    <div class="l-row">
      <p class="l-tag">Tout ce que tu as lu, vu de dos. Et de quoi t'en souvenir.</p>
      <button class="l-cta" id="enter">Entrer dans la bibliothèque →</button>
    </div>
  </div>
  <div class="l-shelf" id="lshelf" aria-hidden="true"></div>
</section>

<!-- Bibliothèque -->
<div id="stage" aria-label="Bibliothèque"><div id="world"><svg id="marks" aria-hidden="true"></svg></div></div>
<svg id="ink" aria-hidden="true"><path id="inkp" d=""/></svg>
<div class="logo" aria-hidden="true">T</div>

<button class="fab" id="fab" aria-expanded="false" aria-controls="menu" aria-label="Affichage"><svg viewBox="0 0 40 40" aria-hidden="true" fill="currentColor"><path d="M20 2l4 4-1.6 14 1.6 14-4 4-4-4 1.6-14L16 6z"/><path d="M2 20l4-4 14 1.6 14-1.6 4 4-4 4-14-1.6L6 24z"/><path d="M20 15l5 5-5 5-5-5z" fill="var(--paper)"/></svg></button>
<div class="menu" id="menu" role="dialog" aria-label="Affichage">
  <div><h4>Vue</h4><div class="opts big" id="layouts">
    <button data-l="etagere" aria-pressed="true">Étagère</button>
    <button data-l="pile" aria-pressed="false">Pile</button>
    <button data-l="trace" aria-pressed="false" disabled>Tracé</button>
  </div></div>
  <div><h4>Ranger par</h4><div class="opts big" id="sorts">
    <button data-s="genre" aria-pressed="true">Genre</button>
    <button data-s="auteur" aria-pressed="false">Auteur</button>
    <button data-s="taille" aria-pressed="false">Taille</button>
    <button data-s="hasard" aria-pressed="false">Hasard</button>
  </div></div>
  <p>Deux doigts pour naviguer, pincer pour zoomer. <b>Maj + glisser</b> (ou le stylet) dessine une étagère. Les livres pâles prennent la poussière : ouvre-les.</p>
  <div class="soon">
    <button data-soon="La wish list arrive bientôt : les livres que tu veux, pour les idées cadeaux.">Wish list</button>
    <button data-soon="Le Reader (mangas .cbz, romans .epub) viendra beaucoup plus tard.">Reader</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Fiche du livre"><div class="sh" id="sh"></div></div>

<script>
// ---------- Données d'exemple (dans l'app : Open Library / Google Books + résumé IA) ----------
// [titre, auteur, parution, pages, genre, format(P poche, S standard, G grand, B beau livre), résumé?]
const RAW=[
["L'Étranger","Albert Camus",1942,186,"Classiques","P","Meursault, petit employé à Alger, apprend la mort de sa mère et assiste à l'enterrement sans pleurer. Le lendemain, il retrouve Marie, va au cinéma et se laisse entraîner par son voisin Raymond dans une histoire de vengeance. Sur une plage écrasée de soleil, il tue un Arabe de cinq coups de revolver, presque sans raison. En prison puis au procès, on lui reproche moins son crime que son indifférence, et surtout de ne pas avoir pleuré sa mère. Condamné à mort, il refuse le réconfort de l'aumônier et accepte enfin « la tendre indifférence du monde »."],
["Le Petit Prince","Antoine de Saint-Exupéry",1943,96,"Classiques","S","Un aviateur tombe en panne dans le Sahara. Un petit garçon surgit et lui demande de dessiner un mouton. Il vient de l'astéroïde B 612, où il a laissé une rose orgueilleuse qu'il aime sans savoir le lui dire. Avant d'arriver sur Terre, il a visité des planètes peuplées d'adultes absurdes : un roi, un vaniteux, un buveur, un businessman, un allumeur de réverbères, un géographe. Sur Terre, un renard lui apprend ce que veut dire « apprivoiser » et que l'essentiel est invisible pour les yeux. Un an après sa chute, il se laisse mordre par un serpent pour rentrer chez lui. L'aviateur repart, et regarde désormais les étoiles autrement."],
["Madame Bovary","Gustave Flaubert",1857,480,"Classiques","P","Emma Rouault, nourrie de romans sentimentaux, épouse Charles Bovary, un officier de santé brave mais terne. La vie de province l'ennuie à mourir. Après un bal au château de la Vaubyessard, elle rêve d'une autre existence. Elle s'éprend du jeune clerc Léon, qui part pour Paris, puis devient la maîtresse de Rodolphe, un séducteur qui l'abandonne la veille de leur fuite. Elle retrouve Léon à Rouen et multiplie les achats à crédit auprès du marchand Lheureux. Couverte de dettes, menacée de saisie, rejetée de tous, elle s'empoisonne à l'arsenic. Charles meurt peu après, ruiné, et leur fille finit ouvrière."],
["Germinal","Émile Zola",1885,590,"Classiques","P","Étienne Lantier, ouvrier sans travail, est embauché à la mine du Voreux, dans le Nord. Il découvre la misère des familles de mineurs, en particulier celle des Maheu, et s'éprend de Catherine, la fille, qui vit avec la brute Chaval. Quand la Compagnie baisse les salaires, Étienne organise une grève. Elle dure des semaines, la faim s'installe, la révolte tourne à l'émeute et l'armée tire sur la foule : Maheu est tué. L'anarchiste Souvarine sabote alors la mine, qui s'effondre. Étienne et Catherine restent emmurés au fond ; elle meurt dans ses bras. Sauvé, Étienne part pour Paris, convaincu qu'une révolte germe sous la terre."],
["Le Comte de Monte-Cristo","Alexandre Dumas",1844,1250,"Classiques","S","En 1815, le jeune marin Edmond Dantès va épouser Mercédès quand il est dénoncé comme bonapartiste par trois jaloux : Danglars, Fernand et Caderousse, avec la complicité du procureur Villefort. Il passe quatorze ans au château d'If, où l'abbé Faria l'instruit et lui révèle un trésor caché sur l'île de Monte-Cristo. Évadé et immensément riche, il réapparaît à Paris sous le nom du comte de Monte-Cristo. Il ruine Danglars, pousse Fernand, devenu comte de Morcerf et mari de Mercédès, au suicide, et fait sombrer Villefort dans la folie. Effrayé par les victimes collatérales de sa vengeance, il finit par épargner certains et part avec Haydée, en laissant un message : « attendre et espérer »."],
["Les Choses","Georges Perec",1965,160,"Classiques","P","Jérôme et Sylvie, la vingtaine, vivent à Paris au début des années 1960. Psychosociologues, ils font des enquêtes d'opinion à la pige. Ils rêvent d'un appartement parfait, de beaux objets, de vêtements anglais, de richesse sans effort. Le livre décrit surtout ces choses qu'ils désirent et ne possèdent pas. Lassés, ils partent enseigner à Sfax, en Tunisie, où ils s'ennuient encore davantage. Ils rentrent en France et finissent par accepter des postes de cadres à Bordeaux : une vie confortable, sans passion, exactement ce qu'ils voulaient éviter."],

["L'Élégance du hérisson","Muriel Barbery",2006,360,"Contemporain","S","Au 7 rue de Grenelle, immeuble bourgeois de Paris, Renée Michel, cinquante-quatre ans, est la concierge. Elle joue la concierge bourrue mais lit Tolstoï, écoute Mahler et adore le cinéma japonais. Au cinquième étage, Paloma, douze ans, surdouée, tient un journal et a décidé de se suicider le jour de ses treize ans. L'arrivée d'un nouveau voisin, Kakuro Ozu, change tout : il devine qui est Renée et l'invite à dîner. Une amitié naît entre eux trois. Mais Renée meurt renversée par une camionnette. Bouleversée, Paloma renonce à son projet de mort."],
["La Tresse","Laetitia Colombani",2017,220,"Contemporain","S","Trois femmes sur trois continents. En Inde, Smita est une intouchable qui vide les latrines ; elle fuit son village pour que sa fille aille à l'école, et fait offrande de leurs cheveux au temple de Tirupati. En Sicile, Giulia découvre que l'atelier familial de perruques, où l'on travaille les cheveux siciliens, est au bord de la faillite ; elle le sauve en important des cheveux d'Inde. Au Canada, Sarah, avocate brillante, apprend qu'elle a un cancer et cache sa maladie au cabinet. À la fin, elle porte une perruque faite des cheveux de Smita, travaillés chez Giulia."],
["Kafka sur le rivage","Haruki Murakami",2002,640,"Contemporain","S","Kafka Tamura, quinze ans, fuit son père à Tokyo, qui lui a prédit qu'il tuerait son père et coucherait avec sa mère et sa sœur. Il se réfugie dans une bibliothèque privée de Shikoku, tenue par l'énigmatique Mlle Saeki et par Oshima. En parallèle, Nakata, un vieil homme devenu simple d'esprit après un étrange incident pendant la guerre, parle aux chats et tue un homme qui se fait appeler Johnnie Walker : c'est peut-être le père de Kafka. Nakata part vers Shikoku avec un routier, Hoshino. Les deux histoires se croisent sans que les personnages se rencontrent. Kafka passe par une forêt hors du temps, puis décide de rentrer à Tokyo."],
["L'Alchimiste","Paulo Coelho",1988,190,"Contemporain","P","Santiago, jeune berger andalou, fait deux fois le même rêve : un trésor l'attend au pied des pyramides d'Égypte. Un vieux roi lui parle de sa « légende personnelle ». Il vend ses moutons, se fait voler à Tanger, travaille un an chez un marchand de cristaux puis rejoint une caravane. Dans une oasis, il tombe amoureux de Fatima et rencontre un alchimiste qui lui apprend à écouter son cœur et le langage du monde. Arrivé aux pyramides, il est battu par des pillards ; l'un d'eux raconte avoir rêvé d'un trésor dans une église en ruine d'Espagne. C'est là, d'où il était parti, que Santiago le trouve."],
["L'Anomalie","Hervé Le Tellier",2020,330,"Contemporain","S","En mars 2021, un vol Air France Paris–New York traverse une violente turbulence et atterrit. En juin, exactement le même avion, avec le même équipage et les mêmes passagers, se présente au-dessus de New York. Le gouvernement américain l'isole et réunit des scientifiques. Le roman suit plusieurs passagers : un tueur à gages, un écrivain, une monteuse, un architecte, un enfant. Chacun doit rencontrer son double, qui a vécu trois mois de plus. Une hypothèse s'impose : notre monde serait une simulation. Certains doubles s'arrangent, d'autres se détruisent. À la fin, un troisième vol se présente."],
["Le Liseur","Bernhard Schlink",1995,240,"Contemporain","P","Dans l'Allemagne d'après-guerre, Michael Berg, quinze ans, est soigné par Hanna, une contrôleuse de tramway de trente-six ans. Ils deviennent amants. Rituel : il lui fait la lecture avant l'amour. Un jour, Hanna disparaît. Des années plus tard, étudiant en droit, Michael assiste à un procès d'anciennes gardiennes de camp nazi et la reconnaît parmi les accusées. Il comprend qu'elle est analphabète, ce qu'elle cache au point d'accepter la responsabilité la plus lourde. Il se tait. Elle est condamnée à perpétuité. Il lui envoie des cassettes de lectures, elle apprend à lire en prison, puis se suicide la veille de sa libération."],
["Americanah","Chimamanda Ngozi Adichie",2013,600,"Contemporain","S","Au Nigeria, Ifemelu et Obinze s'aiment depuis le lycée. Les universités étant en grève, Ifemelu part étudier aux États-Unis. Elle y découvre la pauvreté, l'humiliation et ce que signifie être noire en Amérique, ce qu'elle n'avait jamais ressenti chez elle. Elle coupe le contact avec Obinze, sort avec un riche Américain blanc puis un professeur afro-américain, et tient un blog à succès sur la race. Obinze, refoulé des États-Unis, vit clandestinement à Londres avant d'être expulsé ; il fait ensuite fortune à Lagos et se marie. Treize ans plus tard, Ifemelu rentre au Nigeria. Ils se retrouvent, et Obinze quitte sa femme pour elle."],

["Dune","Frank Herbert",1965,830,"Science-fiction","S","Dans un lointain futur, l'empereur confie au duc Leto Atréides la planète désert Arrakis, seule source de l'Épice, une drogue qui permet les voyages spatiaux. C'est un piège : les Harkonnen attaquent avec l'aide de troupes impériales, et Leto est trahi par son médecin, Yueh. Son fils Paul et sa mère Jessica, de l'ordre Bene Gesserit, s'enfuient dans le désert et sont recueillis par les Fremen. Paul boit l'Eau de vie, développe des dons de prescience, épouse Chani et devient leur chef, Muad'Dib. À la tête des Fremen, il reprend Arrakeen, tue Feyd-Rautha en duel et force l'empereur à abdiquer, tout en pressentant le jihad sanglant qui viendra."],
["Fondation","Isaac Asimov",1951,280,"Science-fiction","P","Hari Seldon a inventé la psychohistoire, qui prédit le comportement des masses. Ses calculs annoncent la chute de l'Empire galactique et trente mille ans de barbarie. Pour réduire cette période à mille ans, il crée une Fondation sur Terminus, une planète au bord de la galaxie, officiellement pour écrire une encyclopédie. Le livre suit les crises successives de la Fondation sur plus d'un siècle. Salvor Hardin joue les royaumes voisins les uns contre les autres grâce à une religion fondée sur la technologie. Plus tard, les marchands, comme Hober Mallow, imposent la Fondation par le commerce. À chaque crise, un hologramme de Seldon confirme que tout était prévu."],
["1984","George Orwell",1949,400,"Science-fiction","P","En 1984, Londres fait partie de l'Océania, gouvernée par le Parti et Big Brother. Winston Smith travaille au ministère de la Vérité, où il réécrit les archives pour qu'elles collent à la propagande. Il tient en secret un journal et tombe amoureux de Julia. Ils se cachent dans une chambre au-dessus d'une brocante et croient rejoindre une résistance, la Fraternité, par l'intermédiaire d'O'Brien. C'est un piège : O'Brien est de la Police de la pensée. Arrêté, torturé au ministère de l'Amour, confronté à sa pire peur dans la salle 101, Winston trahit Julia. Libéré, brisé, il découvre qu'il aime Big Brother."],
["Le Problème à trois corps","Liu Cixin",2008,440,"Science-fiction","S","Pendant la Révolution culturelle, l'astrophysicienne Ye Wenjie voit son père battu à mort. Envoyée dans une base militaire secrète, elle reçoit un message d'une civilisation extraterrestre, Trisolaris, dont le monde est ravagé par trois soleils instables. Désespérée de l'humanité, elle répond et leur indique où est la Terre. Quarante ans plus tard, le chercheur en nanomatériaux Wang Miao enquête sur des suicides de scientifiques et découvre un jeu vidéo étrange, « Trois Corps », qui sert à recruter des partisans des extraterrestres. La flotte trisolarienne est en route et arrivera dans quatre siècles. Pour bloquer le progrès humain d'ici là, elle a envoyé des sophons qui sabotent la physique."],
["Projet Dernière Chance","Andy Weir",2021,500,"Science-fiction","S","Ryland Grace se réveille amnésique dans un vaisseau, seul survivant de l'équipage. La mémoire lui revient par fragments : professeur de sciences, il a découvert l'astrophage, un micro-organisme qui dévore l'énergie du Soleil et va plonger la Terre dans une ère glaciaire. Il est en mission vers Tau Ceti, la seule étoile épargnée, pour comprendre pourquoi. Il y rencontre Rocky, un ingénieur extraterrestre venu pour la même raison, et ils deviennent amis. Ensemble, ils trouvent un prédateur de l'astrophage. Grace apprend qu'on l'a embarqué de force. Sur le chemin du retour, il fait demi-tour pour sauver Rocky, renonce à la Terre et finit professeur sur la planète de son ami."],
["Fahrenheit 451","Ray Bradbury",1953,220,"Science-fiction","P","Dans une société où les livres sont interdits, Guy Montag est pompier : il ne combat pas le feu, il brûle les bibliothèques. Sa rencontre avec Clarisse, une jeune voisine curieuse, puis le suicide d'une femme qui préfère brûler avec ses livres le font douter. Il en cache chez lui. Sa femme Mildred, droguée aux écrans muraux, le dénonce. Son chef Beatty le force à brûler sa propre maison ; Montag le tue au lance-flammes et s'enfuit, traqué par le Limier mécanique. Il rejoint dans les bois des marginaux qui apprennent chacun un livre par cœur. La ville est rasée par une guerre, et ils marchent vers elle pour reconstruire."],
["Klara et le Soleil","Kazuo Ishiguro",2021,340,"Science-fiction","S","Klara est une AA, une « amie artificielle » conçue pour tenir compagnie aux enfants. Dans la vitrine du magasin, elle observe le monde et vénère le Soleil, dont elle tire son énergie. Josie, une adolescente malade, la choisit. Klara découvre que Josie a été « relevée », génétiquement améliorée, ce qui l'a rendue malade, comme sa sœur avant elle, morte. Sa mère prévoit, si Josie meurt, que Klara apprenne à la « continuer ». Klara conclut un pacte avec le Soleil et sacrifie une partie de son fluide pour détruire une machine polluante. Josie guérit, grandit et part à l'université. Klara finit dans une décharge, contente, à trier ses souvenirs."],

["Le Seigneur des anneaux","J.R.R. Tolkien",1954,1200,"Fantasy","G","Le hobbit Frodon hérite de son oncle Bilbon d'un anneau qui se révèle être l'Anneau unique de Sauron, le Seigneur des ténèbres. Seul moyen de l'arrêter : le détruire dans la Montagne du Destin, au cœur du Mordor. Une Communauté se forme : Frodon, Sam, Merry, Pippin, Gandalf, Aragorn, Boromir, Legolas et Gimli. Gandalf tombe dans la Moria, Boromir meurt et la Communauté se disperse. Pendant que les autres combattent au Gouffre de Helm et à Minas Tirith, Frodon et Sam avancent vers le Mordor guidés par Gollum. Au dernier moment, Frodon refuse de jeter l'Anneau ; Gollum le lui arrache avec le doigt et tombe dans la lave. Aragorn devient roi. Frodon, blessé à jamais, part vers les Terres immortelles."],
["Le Hobbit","J.R.R. Tolkien",1937,390,"Fantasy","S","Bilbon Sacquet, hobbit casanier, voit débarquer chez lui le magicien Gandalf et treize nains menés par Thorin Écu-de-Chêne. Ils veulent reprendre au dragon Smaug le trésor de leurs ancêtres sous la Montagne Solitaire, et ont besoin d'un cambrioleur. En route, ils affrontent des trolls, des gobelins, des araignées géantes et les elfes de la forêt. Perdu dans une grotte, Bilbon trouve un anneau d'invisibilité en gagnant un concours d'énigmes contre Gollum. Smaug, réveillé, attaque Lacville et y est tué par l'archer Bard. Le trésor attise les convoitises jusqu'à la bataille des Cinq Armées, où Thorin meurt. Bilbon rentre chez lui, avec l'anneau."],
["Le Nom du vent","Patrick Rothfuss",2007,830,"Fantasy","G","Dans une auberge de campagne, l'aubergiste Kote est en réalité Kvothe, un héros devenu légende. Il accepte de raconter sa vraie histoire à un chroniqueur, en trois jours. Ce premier tome couvre le premier jour : enfant d'une troupe de comédiens itinérants, il voit les siens massacrés par les Chandrian, des êtres de légende. Il survit des années dans les rues de Tarbean, puis entre à l'Université, beaucoup trop jeune. Il y apprend la sympathie, se fait un ennemi juré, Ambrose, et tombe amoureux de l'insaisissable Denna. Il affronte un draccus et commence à chercher le vrai nom du vent."],
["La Passe-miroir","Christelle Dabos",2013,520,"Fantasy","S","Dans un monde éclaté en arches flottantes, Ophélie, jeune femme maladroite d'Anima, sait lire le passé des objets et traverser les miroirs. Elle est fiancée de force à Thorn, un homme froid et taciturne du Pôle, une arche glaciale gouvernée par l'esprit de famille Farouk. À la Citacielle, la cité céleste, les clans s'affrontent par les illusions et les assassinats. Ophélie doit se cacher, sous l'apparence d'un valet, et comprend que Thorn l'a choisie pour une raison secrète : lire le Livre de Farouk. Elle apprend peu à peu à s'affirmer, et à apprécier Thorn."],
["Harry Potter à l'école des sorciers","J.K. Rowling",1997,310,"Fantasy","S","Harry, orphelin, vit maltraité chez son oncle et sa tante Dursley. Le jour de ses onze ans, le géant Hagrid lui apprend qu'il est un sorcier et que ses parents ont été tués par Voldemort, dont il a survécu au sortilège en gardant une cicatrice en forme d'éclair. À Poudlard, il entre à Gryffondor, se lie d'amitié avec Ron et Hermione, et devient attrapeur au Quidditch. Les trois amis découvrent qu'on cherche à voler la pierre philosophale, gardée dans l'école. Ils soupçonnent Rogue, mais c'est le professeur Quirrell, qui abrite Voldemort. Harry l'affronte et protège la pierre."],

["Millénium","Stieg Larsson",2005,710,"Polars","S","Condamné pour diffamation contre l'industriel Wennerström, le journaliste Mikael Blomkvist accepte une mission de Henrik Vanger : découvrir ce qui est arrivé à sa nièce Harriet, disparue en 1966 sur l'île familiale. Il est aidé par Lisbeth Salander, hackeuse asociale et brillante. Ensemble, ils découvrent une série de meurtres de femmes. Le coupable est Martin Vanger, frère d'Harriet, héritier des crimes de son père ; il meurt en fuyant. Harriet est vivante : elle avait fui en Australie pour échapper à son frère et à son père. Lisbeth pirate ensuite Wennerström et lui vole une fortune, ce qui permet à Mikael de révéler ses crimes."],
["Ils étaient dix","Agatha Christie",1939,250,"Polars","P","Dix personnes sans lien apparent sont invitées par un mystérieux M. Owen sur une île au large du Devon. Au premier dîner, un disque les accuse chacune d'un meurtre resté impuni. Puis elles meurent une à une, de la manière décrite dans une comptine accrochée dans chaque chambre, et une figurine disparaît de la table à chaque mort. Il n'y a personne d'autre sur l'île : l'assassin est parmi eux. La dernière, Vera Claythorne, se pend. L'épilogue révèle que le juge Wargrave a tout organisé, simulé sa propre mort, puis s'est suicidé pour laisser une énigme parfaite."],
["Le Crime de l'Orient-Express","Agatha Christie",1934,250,"Polars","P","Hercule Poirot rentre d'Istanbul dans l'Orient-Express. Pendant la nuit, le train est bloqué par la neige en Yougoslavie et un riche Américain, Ratchett, est retrouvé poignardé de douze coups dans son compartiment. Poirot découvre que Ratchett était en réalité Cassetti, qui avait enlevé et tué la petite Daisy Armstrong des années plus tôt avant d'échapper à la justice. Les douze passagers ont tous des alibis qui se croisent. Poirot comprend qu'ils sont tous liés à la famille Armstrong et ont tous frappé. Il propose deux solutions à la police, et choisit de donner la fausse : un inconnu qui se serait enfui."],
["La Vérité sur l'affaire Harry Quebert","Joël Dicker",2012,670,"Polars","S","En 2008, le jeune écrivain Marcus Goldman est en panne d'inspiration. Il rejoint son mentor Harry Quebert dans le New Hampshire, au moment où l'on retrouve dans son jardin le corps de Nola Kellergan, quinze ans, disparue en 1975, avec qui Harry avait eu une liaison. Persuadé de son innocence, Marcus enquête et en tire un livre. Les fausses pistes s'enchaînent. On découvre que Harry n'a pas écrit son chef-d'œuvre : c'était le roman de Luther Caleb, mort depuis. Et le véritable meurtrier de Nola est le policier Travis Dawn, qui a aussi tué la mère de Nola, celle-ci la battant."],

["Sapiens","Yuval Noah Harari",2011,500,"Essais","G","Il y a 70 000 ans, Homo sapiens n'était qu'une espèce parmi d'autres. Harari raconte comment elle a dominé la planète en trois révolutions. La révolution cognitive lui donne le langage et surtout la capacité de croire à des fictions partagées (dieux, nations, argent, entreprises), ce qui permet de coopérer à des millions. La révolution agricole augmente la population mais rend la vie plus dure pour la plupart. Puis l'unification par l'argent, les empires et les religions, et enfin la révolution scientifique, qui s'allie au capitalisme. Le livre se termine sur la question du bonheur et sur un futur où sapiens pourrait se transformer lui-même."],

const PAL=["#1B2A4A","#CDBDA2","#9B2B25","#2E4D3D","#E6DCCB","#E0A93A","#2F4858","#B9C5C9","#6A4D37","#F2EEE6","#B5452E","#242424","#3F6D80","#D2662F","#7B8957","#D8D2C2","#0F5257","#EAC6BC","#F1D04B","#4A3A2A","#8FB3A2","#C8201A"];
const FMT={P:{h:178,n:"Poches"},S:{h:212,n:"Standards"},G:{h:240,n:"Grands formats"},B:{h:290,n:"Beaux livres"}};
const GORDER=["Classiques","Contemporain","Science-fiction","Fantasy","Polars","Essais","Beaux livres"];
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255};
const BOOKS=RAW.map((r,i)=>{const [t,a,y,p,g,f,s]=r,h=FMT[f].h,w=Math.round(Math.max(14,Math.min(62,f==="B"?p/4.5+14:p/17+6))),c=PAL[(i*7+3)%PAL.length];
  return{i,t,a,y,p,g,f,s,h,w,c,ink:lum(c)>.58?"#121212":"#F5F3EE",v:(i*5+1)%4,last:a.split(" ").pop(),d:(i*137)%520,ry:2008+(i*7)%17}});

// ---------- Outils ----------
const $=s=>document.querySelector(s);
const rnd=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const f1=n=>n.toFixed(1);
function curve(p,closed){const n=p.length;if(n<2)return"";let d=`M${f1(p[0][0])},${f1(p[0][1])}`;const g=i=>closed?p[(i+n)%n]:p[Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=`C${f1(p1[0]+(p2[0]-p0[0])/6)},${f1(p1[1]+(p2[1]-p0[1])/6)} ${f1(p2[0]-(p3[0]-p1[0])/6)},${f1(p2[1]-(p3[1]-p1[1])/6)} ${f1(p2[0])},${f1(p2[1])}`}
  return closed?d+"Z":d}
// contour "entouré au stylo" : ne se referme pas tout à fait
function blob(cx,cy,rx,ry,seed,amp=.1,n=9){const R=rnd(seed),pts=[],o=R()*6;for(let i=0;i<=n;i++){const a=o+i/n*Math.PI*2*1.04,k=1+(R()-.5)*2*amp;pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return curve(pts,false)}
function wob(x0,x1,y,seed){const R=rnd(seed),pts=[];for(let x=x0;x<x1;x+=80)pts.push([x,y+(R()-.5)*3.4]);pts.push([x1,y+(R()-.5)*3.4]);return curve(pts,false)}

// ---------- Landing ----------
$("#lcount").textContent=BOOKS.length+" livres lus";
(()=>{const sh=$("#lshelf"),R=rnd(4);[...BOOKS].sort(()=>R()-.5).slice(0,90).forEach((b,k)=>{const e=document.createElement("span");
  e.style.cssText=`width:${b.w*.8}px;height:${b.h*.5}px;background:${b.c};animation-delay:${300+k*18}ms`;sh.appendChild(e)})})();

// ---------- Tranches ----------
const world=$("#world"),marks=$("#marks"),stage=$("#stage");
const spineHTML=b=>`<span class="spine"><span class="pg"></span><span class="sf"></span><span class="cov"></span><span class="txt"><span class="au">${b.last}</span><span class="ti">${b.t}</span><span class="mk"></span></span></span>`;
BOOKS.forEach(b=>{const e=document.createElement("button");e.className=`book v${b.v}`+(b.w<22?" thin":"")+(b.d>390?" dusty":"");
  e.style.cssText=`--w:${b.w}px;--h:${b.h}px;--c:${b.c};--t:${b.ink};--fs:${Math.min(15,Math.max(8.5,b.w*.42))}px`;
  e.setAttribute("aria-label",`${b.t}, ${b.a}`);e.innerHTML=spineHTML(b);e.dataset.i=b.i;b.el=e;world.appendChild(e)});

// ---------- Tris ----------
const state={layout:"etagere",sort:"genre",seed:7,trace:null};
const SORTS={
  genre:{key:b=>b.g,sort:a=>a.sort((x,y)=>GORDER.indexOf(x.g)-GORDER.indexOf(y.g)||x.y-y.y)},
  auteur:{key:b=>b.last.normalize("NFD")[0].toUpperCase(),sort:a=>a.sort((x,y)=>x.last.localeCompare(y.last,"fr")||x.y-y.y)},
  taille:{key:b=>FMT[b.f].n,sort:a=>a.sort((x,y)=>x.h-y.h||x.w-y.w)},
  hasard:{key:null,sort:a=>{const R=rnd(state.seed);return a.map(b=>[R(),b]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}}
};
function groups(){const s=SORTS[state.sort],arr=s.sort([...BOOKS]);if(!s.key)return[{key:null,items:arr}];
  const out=[];arr.forEach(b=>{const k=s.key(b);if(!out.length||out.at(-1).key!==k)out.push({key:k,items:[]});out.at(-1).items.push(b)});return out}
const lw=(t,size)=>t.length*size*.5+size*.4;   // largeur approx. d'un titre condensé

// ---------- Dispositions ----------
let tile=null; // pour le cosmos : taille du motif répété à l'infini
const LAY={
  etagere(G){const pos={},labels=[],paths=[],ROW=Math.max(900,Math.min(1900,innerWidth*1.25)),RH=430,BASE=330,GS=state.sort==="auteur"?60:70;let x=0,row=0,maxX=0;
    const shelf=()=>paths.push({d:wob(-40,maxX+40,row*RH+BASE+3,row+7)});
    G.forEach((g,gi)=>{if(gi&&g.key)x+=50;const need=g.key?lw(g.key,GS):0;let gx=null;if(g.key&&x>0&&x+Math.max(need,160)>ROW){shelf();row++;x=0;maxX=0}
      g.items.forEach((b,k)=>{if(x+b.w>ROW&&x>0){shelf();row++;x=0;maxX=0}if(k===0){gx=x;if(g.key)labels.push({t:g.key,x,y:row*RH+BASE-300,s:GS})}
        pos[b.i]={x:x+b.w/2,y:row*RH+BASE-b.h/2,r:0};x+=b.w+2;maxX=Math.max(maxX,x)});
      if(gx!==null&&x-gx<need){x=gx+need;maxX=Math.max(maxX,x)}});
    shelf();return{pos,labels,paths}},
  pile(G){const pos={},labels=[],paths=[];let y=0;
    G.forEach((g,gi)=>{g.items.forEach((b,k)=>{const R=rnd(b.i*31+gi);if(k===0&&g.key)labels.push({t:g.key,x:190,y:y+50,s:64});
      pos[b.i]={x:(R()-.5)*30,y:y+b.w/2,r:90+(R()-.5)*4};y+=b.w+1})});
    paths.push({d:wob(-220,220,y+4,3)});return{pos,labels,paths,top:true}},
  trace(G){const pos={},paths=[],P=state.trace;if(!P)return LAY.etagere(G);
    const L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const tot=L.at(-1);
    const at=s=>{let i=1;while(i<L.length-1&&L[i]<s)i++;const t=(s-L[i-1])/((L[i]-L[i-1])||1);return{x:P[i-1][0]+(P[i][0]-P[i-1][0])*t,y:P[i-1][1]+(P[i][1]-P[i-1][1])*t,a:Math.atan2(P[i][1]-P[i-1][1],P[i][0]-P[i-1][0])}};
    let s=0,row=0;G.flatMap(g=>g.items).forEach(b=>{if(s+b.w>tot){row++;s=0}const p=at(s+b.w/2),off=b.h/2+3+row*330;
      pos[b.i]={x:p.x+Math.sin(p.a)*off,y:p.y-Math.cos(p.a)*off,r:p.a*180/Math.PI};s+=b.w+2});
    for(let r=0;r<=row;r++)paths.push({d:curve(P.filter((_,k)=>k%3===0||k===P.length-1).map(([x,y],k,A)=>{const q=A[Math.min(k+1,A.length-1)],o=A[Math.max(k-1,0)],a=Math.atan2(q[1]-o[1],q[0]-o[0]);return[x+Math.sin(a)*r*330,y-Math.cos(a)*r*330]}),false),k:r===0});
    return{pos,labels:[],paths}}
};

// ---------- Rendu ----------
let bbox=null,clones=null,cur=null;
function labelHTML(l,k){const w=lw(l.t,l.s);return`<svg viewBox="0 0 ${w} ${l.s}" preserveAspectRatio="none" aria-hidden="true"><path d="${blob(w/2,l.s*.5,w/2,l.s*.55,k*17+state.sort.length,.07,8)}"/></svg><span class="big">${l.t}</span>`}
function render(first){const G=groups(),R=LAY[state.layout](G),order=G.flatMap(g=>g.items);if(!R.tile)tile=null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  order.forEach((b,k)=>{const p=R.pos[b.i],rad=Math.max(b.w,b.h)/2;x0=Math.min(x0,p.x-rad);x1=Math.max(x1,p.x+rad);y0=Math.min(y0,p.y-rad);y1=Math.max(y1,p.y+rad);
    b.tf=`translate(${f1(p.x-b.w/2)}px,${f1(p.y-b.h/2)}px) rotate(${f1(p.r)}deg)`;b.el.style.transitionDelay=first?"0ms":Math.min(k*3,420)+"ms";b.el.style.transform=b.tf});
  R.labels.forEach(l=>{y0=Math.min(y0,l.y-l.s);x1=Math.max(x1,l.x+lw(l.t,l.s))});bbox={x0,y0,x1,y1};
  const offs=tile?[[0,0],...[-1,0,1].flatMap(a=>[-1,0,1].map(c=>[a,c])).filter(([a,c])=>a||c)]:[[0,0]];
  marks.innerHTML=offs.map(([a,c])=>`<g transform="translate(${tile?a*tile.w:0},${tile?c*tile.h:0})">${R.paths.map(p=>`<path class="${p.k?"k":""}" d="${p.d}"/>`).join("")}</g>`).join("");
  world.querySelectorAll(".glabel,.clones").forEach(e=>e.remove());
  const labs=R.labels.map((l,k)=>{const e=document.createElement("div");e.className="glabel";e.style.cssText=`transform:translate(${l.x}px,${l.y-l.s}px);--gs:${l.s}px`;e.innerHTML=labelHTML(l,k);world.appendChild(e);return e});
  if(tile){clones=document.createElement("div");clones.className="clones";const html=order.map(b=>b.el.outerHTML.replace(/transition-delay:[^;"]*;?/,"transition:none;")).join("")+labs.map(e=>e.outerHTML).join("");
    offs.slice(1).forEach(([a,c])=>{const d=document.createElement("div");d.style.cssText=`position:absolute;left:0;top:0;transform:translate(${a*tile.w}px,${c*tile.h}px)`;d.innerHTML=html;clones.appendChild(d)});
    world.insertBefore(clones,world.firstChild.nextSibling)}else clones=null;
  fit(R)}

// ---------- Caméra : trackpad, pincement, glisser, inertie, cosmos sans fin ----------
const cam={x:0,y:0,s:.5},tgt={x:0,y:0,s:.5};let K=.3,vx=0,vy=0,inert=false;
const minS=()=>tile?Math.max(innerWidth/tile.w,innerHeight/tile.h)*1.02:.12;
function fit(R){if(!bbox)return;const W=innerWidth,H=innerHeight;
  if(R&&R.top){const s=Math.min(1.1,(W-40)/560,H/700);tgt.s=s;tgt.x=W/2-(bbox.x0+bbox.x1)/2*s+(W>700?-60*s:-80*s);tgt.y=110-bbox.y0*s}
  else if(tile){const s=Math.max(minS(),Math.min(.95,W/1300));tgt.s=s;tgt.x=W/2-tile.w/2*s;tgt.y=H/2-tile.h/2*s}
  else{const bw=bbox.x1-bbox.x0+120,bh=bbox.y1-bbox.y0+200,s=Math.max(Math.min(.62,W/1500+.1),Math.min(1,W/bw,H/bh));tgt.s=s;
    tgt.x=bw*s<W?W/2-(bbox.x0+bbox.x1)/2*s:40-bbox.x0*s;tgt.y=bh*s<H?H/2-(bbox.y0+bbox.y1)/2*s+20:90-bbox.y0*s}
  K=.07;inert=false}
function zoomAt(mx,my,f){const ns=Math.max(minS(),Math.min(3,tgt.s*f));f=ns/tgt.s;tgt.x=mx-(mx-tgt.x)*f;tgt.y=my-(my-tgt.y)*f;tgt.s=ns}
function wrap(){if(!tile)return;const cxw=(innerWidth/2-cam.x)/cam.s,cyw=(innerHeight/2-cam.y)/cam.s;
  if(cxw>tile.w){cam.x+=tile.w*cam.s;tgt.x+=tile.w*tgt.s}else if(cxw<0){cam.x-=tile.w*cam.s;tgt.x-=tile.w*tgt.s}
  if(cyw>tile.h){cam.y+=tile.h*cam.s;tgt.y+=tile.h*tgt.s}else if(cyw<0){cam.y-=tile.h*cam.s;tgt.y-=tile.h*tgt.s}}
const apply=()=>world.style.transform=`translate3d(${cam.x}px,${cam.y}px,0) scale(${cam.s})`;
(function loop(){if(inert){tgt.x+=vx;tgt.y+=vy;vx*=.94;vy*=.94;if(Math.abs(vx)+Math.abs(vy)<.05)inert=false}
  const dx=tgt.x-cam.x,dy=tgt.y-cam.y,ds=tgt.s-cam.s;if(Math.abs(dx)+Math.abs(dy)+Math.abs(ds)*500>.02){cam.x+=dx*K;cam.y+=dy*K;cam.s+=ds*K;wrap();apply()}else if(K<.3)K=.3;
  requestAnimationFrame(loop)})();
stage.addEventListener("wheel",e=>{e.preventDefault();K=.35;inert=false;
  if(e.ctrlKey)zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.012));else{const m=e.deltaMode===1?24:1;tgt.x-=e.deltaX*m;tgt.y-=e.deltaY*m}},{passive:false});
let gs=1;stage.addEventListener("gesturestart",e=>{e.preventDefault();gs=1});
stage.addEventListener("gesturechange",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.scale/gs);gs=e.scale});

const ptrs=new Map();let drag=null,pinch=null,ink=null;const inkp=$("#inkp");
const toWorld=(x,y)=>[(x-cam.x)/cam.s,(y-cam.y)/cam.s];
stage.addEventListener("pointerdown",e=>{closeMenu();stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});inert=false;K=1;Object.assign(tgt,cam);
  if(e.pointerType==="pen"||e.shiftKey){ink={pts:[[e.clientX,e.clientY]]};stage.classList.add("drawing");return}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};drag=null;return}
  drag={moved:0,target:e.target.closest(".book")}});
stage.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ink){ink.pts.push([e.clientX,e.clientY]);inkp.setAttribute("d",curve(ink.pts.filter((_,k)=>k%2===0),false));return}
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch.d);pinch.d=d;Object.assign(cam,tgt);wrap();apply();return}
  if(drag){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;drag.moved+=Math.abs(dx)+Math.abs(dy);if(drag.moved>6)stage.classList.add("grabbing");tgt.x+=dx;tgt.y+=dy;vx=dx;vy=dy}});
function up(e){ptrs.delete(e.pointerId);stage.classList.remove("grabbing","drawing");
  if(ink){const pts=ink.pts;ink=null;inkp.setAttribute("d","");let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    if(len>120){state.trace=pts.map(p=>toWorld(p[0],p[1]));$('[data-l="trace"]').disabled=false;setLayout("trace")}return}
  if(pinch){if(ptrs.size<2)pinch=null;return}
  if(drag){if(drag.moved<6&&drag.target)openBook(BOOKS[+drag.target.dataset.i],drag.target);else if(Math.abs(vx)+Math.abs(vy)>1){inert=true;K=.3}else K=.3;drag=null}}
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>render(true),200)});
stage.addEventListener("keydown",e=>{const b=e.target.closest(".book");if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openBook(BOOKS[+b.dataset.i],b)}});

// ---------- Menu ----------
const fab=$("#fab"),menu=$("#menu");
function closeMenu(){menu.classList.remove("on");fab.setAttribute("aria-expanded","false")}
fab.addEventListener("click",()=>{const on=!menu.classList.contains("on");menu.classList.toggle("on",on);fab.setAttribute("aria-expanded",on)});
function press(sel,attr,val){document.querySelectorAll(sel+" button").forEach(b=>b.setAttribute("aria-pressed",b.dataset[attr]===val))}
function setLayout(l){state.layout=l;press("#layouts","l",l);render()}
$("#layouts").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&!b.disabled)setLayout(b.dataset.l)});
$("#sorts").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.s==="hasard")state.seed++;state.sort=b.dataset.s;press("#sorts","s",state.sort);render()});
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3400)}
document.querySelectorAll("[data-soon]").forEach(b=>b.addEventListener("click",()=>toast(b.dataset.soon)));

// ---------- Fiche : la tranche pivote et devient la couverture ----------
const sheet=$("#sheet");let src=null,startT="",busy=false;
const restT="rotateY(-24deg)",flipT="rotateY(156deg)",covers={};
function openBook(b,el){if(busy||cur)return;cur=b;src=el;const H=Math.round(Math.min(innerHeight*.62,innerWidth<820?360:500)*(b.f==="B"?1:Math.min(1,.86+b.h/1500))),
  W=Math.round(H*(b.f==="B"?.8:.66)),D=Math.max(10,Math.round(b.w*H/b.h)),R=rnd(b.i*7+1);
  const bars=Array.from({length:32},()=>`<span style="--bw:${1+Math.floor(R()*3)}px"></span>`).join("");
  const seen=b.d>365?`il y a ${Math.round(b.d/30)} mois`:`il y a ${b.d} j`;
  $("#sh").innerHTML=`
  <div class="b3" tabindex="0" role="button" aria-label="Retourner le livre">
    <div class="bx v${b.v}" style="--W:${W}px;--H:${H}px;--D:${D}px;--c:${b.c};--t:${b.ink}">
      <div class="shadow3"></div>
      <div class="bf front v${b.v}"><div class="ca">${b.a}</div><div class="ct big">${b.t}</div>
        <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="${blob(100,100,58+R()*25,52+R()*25,b.i*3+2,.2,7)}"/><path d="${blob(104,96,30+R()*20,28+R()*20,b.i*3+9,.25,6)}"/></svg>
        <div class="cy">${b.y}</div><img class="real" alt=""></div>
      <div class="bf back"><div class="bk">${b.t}</div><p>${b.s?b.s.split(/(?<=[.!?»])\s/).slice(0,2).join(" "):"Texte de quatrième de couverture récupéré automatiquement (Open Library ou Google Books)."}</p><div class="bars" aria-hidden="true">${bars}</div></div>
      <div class="bf side bsp v${b.v}" style="--fs:${Math.max(10,D*.42)}px"><span class="txt"><span class="au">${b.last}</span><span class="ti">${b.t}</span><span class="mk"></span></span></div>
      <div class="bf side bpg"></div><div class="bf btop"></div>
    </div></div>
  <div class="info">
    <span class="gk big"><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path d="${blob(50,15,50,15,b.i+9,.06,8)}"/></svg>${b.g}</span>
    <h2 class="big">${b.t}</h2><p class="by">${b.a}</p>
    <dl><div><dt>Paru</dt><dd>${b.y}</dd></div><div><dt>Pages</dt><dd>${b.p}</dd></div><div><dt>Lu en</dt><dd>${b.ry}</dd></div><div><dt>Revu</dt><dd>${seen}</dd></div></dl>
    <h3>Résumé de l'intrigue</h3>${b.s?`<p class="sum">${b.s}</p>`:`<p class="sum" style="color:var(--ink-soft)">Livre d'exemple sans résumé. Dans l'app, le résumé complet de l'intrigue est généré par l'IA quand tu ajoutes le livre.</p>`}
    <div class="acts"><button class="btn" id="flip">Retourner</button><button class="btn ghost" id="close">Ranger</button></div>
  </div>`;
  sheet.scrollTop=0;sheet.classList.add("on");
  const bx=$("#sh .bx"),r0=bx.getBoundingClientRect(),r1=el.getBoundingClientRect(),k=r1.height/H||.2;
  startT=`translate(${r1.left+r1.width/2-(r0.left+r0.width/2)}px,${r1.top+r1.height/2-(r0.top+r0.height/2)}px) scale(${Math.max(k,.05)}) rotateY(90deg)`;
  bx.style.transition="none";bx.style.transform=startT;bx.getBoundingClientRect();el.classList.add("gone");
  requestAnimationFrame(()=>{bx.style.transition="transform 1.15s cubic-bezier(.3,.8,.2,1)";bx.style.transform=restT;sheet.classList.add("ready")});
  const b3=$("#sh .b3");let flipped=false;const flip=()=>{if(sheet.scrollTop>40&&innerWidth<820)sheet.scrollTo({top:0,behavior:"smooth"});flipped=!flipped;bx.style.transition="transform 1s var(--ease)";bx.style.transform=flipped?flipT:restT};
  b3.addEventListener("click",flip);b3.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}});$("#flip").addEventListener("click",flip);$("#close").addEventListener("click",closeBook);
  setTimeout(()=>$("#close")?.focus({preventScroll:true}),600);realCover(b,$("#sh .real"))}
// Vraie couverture via Open Library (marche en local ou en ligne ; bloqué dans l'aperçu Claude, on garde alors la couverture générée)
async function realCover(b,img){try{let u=covers[b.i];if(u===undefined){const q=`https://openlibrary.org/search.json?title=${encodeURIComponent(b.t)}&author=${encodeURIComponent(b.last)}&limit=1&fields=cover_i`;
  const r=await fetch(q);const j=await r.json();const id=j.docs?.[0]?.cover_i;u=covers[b.i]=id?`https://covers.openlibrary.org/b/id/${id}-L.jpg`:null}
  if(u&&img){img.onload=()=>img.classList.add("on");img.src=u}}catch(e){covers[b.i]=null}}
function closeBook(){if(!cur||busy)return;busy=true;const b=cur,el=src,bx=$("#sh .bx");sheet.classList.remove("ready");
  const r1=el.getBoundingClientRect(),r0=(bx.style.transform="none",bx.style.transition="none",bx.getBoundingClientRect());bx.style.transform=restT;bx.getBoundingClientRect();
  const k=r1.height/parseFloat(getComputedStyle(bx).getPropertyValue("--H"));
  bx.style.transition="transform .9s cubic-bezier(.5,0,.2,1)";bx.style.transform=`translate(${r1.left+r1.width/2-(r0.left+r0.width/2)}px,${r1.top+r1.height/2-(r0.top+r0.height/2)}px) scale(${Math.max(k,.05)}) rotateY(90deg)`;
  setTimeout(()=>sheet.classList.remove("on"),450);
  setTimeout(()=>{el.classList.remove("gone");cur=null;busy=false;$("#sh").innerHTML="";
    if(b.d>365){b.d=0;document.querySelectorAll(`.book[data-i="${b.i}"]`).forEach(x=>x.classList.remove("dusty"));toast(`« ${b.t} » a repris ses couleurs.`)}},900)}
sheet.addEventListener("click",e=>{if(e.target===sheet||e.target.id==="sh")closeBook()});
addEventListener("keydown",e=>{if(e.key==="Escape"){if(cur)closeBook();else closeMenu()}});

// ---------- Entrée ----------
render(true);cam.x=tgt.x;cam.y=tgt.y+300;cam.s=tgt.s*.92;apply();
$("#enter").addEventListener("click",()=>{$("#landing").classList.add("out");K=.05});
</script>
</body>
